[server]
bind = "0.0.0.0:8081"
control_api_token_env = "RUSTFS_TRANSFER__SERVER__CONTROL_API_TOKEN"

[database]
url = "postgres://rustfs_transfer_edge:change-me@127.0.0.1:5432/rustfs_transfer_edge"

[center]
# Kept for legacy audit tooling and non-export compatibility only.
# Edge offline export must not depend on Center reachability or this URL.
base_url = "http://center.example.com:8080"
edge_code = "edge-demo"
# Kept as an audit identifier for legacy Center HMAC requests.
# It is not required by the Edge offline export main flow.
auth_key_id = "CHANGE_ME_AUTH_KEY_ID"
# Deploy-time source for center.edge_auth_secret. Use a secret manager or
# environment file; never place a real authorization secret in this example.
# In offline export this secret is only an HMAC derivation input for the
# per-seal disk_data_key, never the AES-256-GCM key itself.
edge_auth_secret_env = "RUSTFS_TRANSFER__CENTER__EDGE_AUTH_SECRET"

[rustfs]
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
access_key_id = "CHANGE_ME_ACCESS_KEY"
secret_access_key = "CHANGE_ME_SECRET_KEY"

[paths]
data_dir = "/var/lib/rustfs-transfer/edge"
log_dir = "/var/log/rustfs-transfer/edge"
transport_mount_root = "/mnt/rustfs-transfer"

[rescan]
token_env = "RUSTFS_TRANSFER__RESCAN__TOKEN"

[auto_export]
# Conservative default: keep automatic scan/export disabled until an Edge
# deployment window explicitly enables both flags below.
enabled = false
start_on_ready = false
min_ready_disk_count = 1
cooldown_seconds = 60

