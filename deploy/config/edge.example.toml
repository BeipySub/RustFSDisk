[server]
bind = "0.0.0.0:8081"

[database]
url = "postgres://rustfs_transfer_edge:change-me@127.0.0.1:5432/rustfs_transfer_edge"

[edge]
edge_code = "edge-demo"
edge_key = "CHANGE_ME_EDGE_KEY_FROM_CENTER"

[rustfs]
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
access_key_id = "CHANGE_ME_ACCESS_KEY"
secret_access_key = "CHANGE_ME_SECRET_KEY"

[paths]
data_dir = "/var/lib/rustfs-transfer/edge"
log_dir = "/var/log/rustfs-transfer/edge"
transport_mount_root = "/mnt/rustfs-transfer"

[rescan]
token_env = "RUSTFS_TRANSFER__RESCAN__TOKEN"

[scan]
# Reuse a successful RustFS scan within this many minutes. Set to 0 to scan
# RustFS on every automatic orchestration attempt, which is useful for testing.
reuse_window_minutes = 1440

[auto_export]
# Conservative default: keep automatic scan/export disabled until an Edge
# deployment window explicitly enables both flags below.
enabled = false
start_on_ready = false
min_ready_disk_count = 1
cooldown_seconds = 60

