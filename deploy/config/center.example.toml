[center]
center_id = "00000000-0000-0000-0000-000000000001"
center_name = "RustFS Transfer Center"
protocol_version = "1.0"

[server]
bind = "0.0.0.0:8080"
control_api_token_env = "CONTROL_API_TOKEN"

[database]
url = "postgres://rustfs_transfer_center:change-me@127.0.0.1:5432/rustfs_transfer_center"

[rustfs]
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
access_key_id = "CHANGE_ME_ACCESS_KEY"
secret_access_key = "CHANGE_ME_SECRET_KEY"

[paths]
data_dir = "/var/lib/rustfs-transfer/center"
log_dir = "/var/log/rustfs-transfer/center"
transport_mount_root = "/mnt/rustfs-transfer"

[security]
local_master_key_env = "LOCAL_MASTER_KEY"
center_signature_key_env = "CENTER_SIGNATURE_KEY"
